<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elements Viewer</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Elements</p>
          <h1>Realtime Viewer</h1>
        </div>
        <div class="statusbox">
          <span id="relay-pill" class="pill pill-offline">relay disconnected</span>
          <span id="controller-pill" class="pill pill-offline">controller disconnected</span>
        </div>
      </header>

      <section class="summary">
        <div class="summary-card">
          <span class="label">Playback</span>
          <strong id="playback-state">idle</strong>
        </div>
        <div class="summary-card">
          <span class="label">Session</span>
          <strong id="session-id">none</strong>
        </div>
        <div class="summary-card">
          <span class="label">Time</span>
          <strong id="time-readout">0.00s</strong>
        </div>
      </section>

      <section class="viewer">
        <div id="empty-state" class="empty-state">
          <h2 id="empty-title">No active session</h2>
          <p id="empty-copy">Load and play an animation from the writer client to see frames here.</p>
        </div>
        <div id="strip-list" class="strip-list"></div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
