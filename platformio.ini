[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_src_filter =
    +<colors.cpp>
    +<compositor.cpp>
    +<decoder.cpp>
    +<engine.cpp>
    +<firmware/discovery_runtime.cpp>
    +<firmware/diagnostics.cpp>
    +<firmware/esp_device.cpp>
    +<firmware/main.cpp>
    +<firmware/tcp_commands.cpp>
    +<firmware/wifi_runtime.cpp>
    +<playback_device.cpp>

[env:esp32dev_led0_sanity]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_src_filter =
    +<firmware/led0_sanity.cpp>
