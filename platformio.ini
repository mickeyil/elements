[platformio]
workspace_dir = local/pio
build_dir = build/pio

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -DNDEBUG -std=gnu++17
build_src_filter =
    +<app/crc32.cpp>
    +<core/colors.cpp>
    +<core/compositor.cpp>
    +<core/decoder.cpp>
    +<core/gamma.cpp>
    +<app/hardware_profile_store.cpp>
    +<app/wifi_cred_store.cpp>
    +<platform/esp32/esp_device_identity.cpp>
    +<platform/esp32/esp_network_interface.cpp>
    +<platform/esp32/esp_platform_clock.cpp>
    +<platform/esp32/esp_system_platform.cpp>
    +<platform/esp32/nvs_key_value_store.cpp>
    +<app/discovery.cpp>
    +<platform/esp32/esp_file_store.cpp>
    +<platform/esp32/esp_tcp_transport.cpp>
    +<platform/esp32/esp_udp_transport.cpp>
    +<core/engine.cpp>
    +<platform/esp32/wifi_manager.cpp>
    +<platform/esp32/wifi_provisioning.cpp>
    +<app/app.cpp>
    +<app/playback.cpp>
    +<app/animation_store.cpp>
    +<app/command_handler.cpp>
    +<app/local_animation.cpp>
    +<app/command_processor.cpp>
    +<app/controller_link.cpp>
    +<app/clock_sync_client.cpp>
    +<app/slog.cpp>
    +<app/log_sender.cpp>
    +<app/wire_reader.cpp>
    +<app/wire_writer.cpp>
    +<core/blob_reader.cpp>
    +<core/program.cpp>
    +<core/layer.cpp>
    +<core/copy_ops.cpp>
    +<core/pixel_buffer_pool.cpp>
    +<core/pixel_view.cpp>
    +<core/pixel_views.cpp>
    +<core/strip.cpp>
    +<core/animations/wave.cpp>
    +<core/animations/spark.cpp>
    +<core/animations/paint.cpp>
    +<core/animations/shift.cpp>
    +<core/animations/pacifica.cpp>
    +<core/fx_math.cpp>
    +<platform/esp32/esp_frame_output.cpp>
    +<platform/esp32/main.cpp>

[env:esp32dev_pacifica]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -DNDEBUG -std=gnu++17
build_src_filter =
    +<platform/esp32/tests/pacifica.cpp>

[env:esp32dev_led0_sanity]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -DNDEBUG -std=gnu++17
build_src_filter =
    +<platform/esp32/tests/led0_sanity.cpp>
