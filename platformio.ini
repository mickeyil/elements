[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_src_filter =
    +<background_crc.cpp>
    +<colors.cpp>
    +<compositor.cpp>
    +<decoder.cpp>
    +<firmware/background_store.cpp>
    +<firmware/controller_connection.cpp>
    +<firmware/device_identity.cpp>
    +<firmware/diagnostics.cpp>
    +<firmware/discovery_service.cpp>
    +<firmware/esp_device.cpp>
    +<firmware/firmware_app.cpp>
    +<engine.cpp>
    +<firmware/main.cpp>
    +<firmware/wifi_manager.cpp>
    +<playback_device.cpp>

[env:esp32dev_led0_sanity]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_src_filter =
    +<firmware/led0_sanity.cpp>
