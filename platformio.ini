[platformio]
workspace_dir = local/pio
build_dir = build/pio

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -DNDEBUG -std=gnu++17
build_src_filter =
    +<crc32.cpp>
    +<colors.cpp>
    +<compositor.cpp>
    +<decoder.cpp>
    +<gamma.cpp>
    +<hardware_profile_store.cpp>
    +<wifi_cred_store.cpp>
    +<firmware/esp_device_identity.cpp>
    +<firmware/esp_network_interface.cpp>
    +<firmware/esp_platform_clock.cpp>
    +<firmware/esp_system_platform.cpp>
    +<firmware/nvs_key_value_store.cpp>
    +<discovery.cpp>
    +<firmware/esp_file_store.cpp>
    +<firmware/esp_tcp_transport.cpp>
    +<firmware/esp_udp_transport.cpp>
    +<engine.cpp>
    +<firmware/wifi_manager.cpp>
    +<app.cpp>
    +<playback.cpp>
    +<animation_store.cpp>
    +<command_handler.cpp>
    +<command_processor.cpp>
    +<controller_link.cpp>
    +<clock_sync_client.cpp>
    +<wire_reader.cpp>
    +<wire_writer.cpp>
    +<blob_reader.cpp>
    +<program.cpp>
    +<layer.cpp>
    +<copy_ops.cpp>
    +<pixel_buffer_pool.cpp>
    +<pixel_view.cpp>
    +<pixel_views.cpp>
    +<strip.cpp>
    +<animations/wave.cpp>
    +<animations/spark.cpp>
    +<animations/paint.cpp>
    +<animations/shift.cpp>
    +<firmware/esp_frame_output.cpp>
    +<firmware/main.cpp>

[env:esp32dev_led0_sanity]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -DNDEBUG -std=gnu++17
build_src_filter =
    +<firmware/tests/led0_sanity.cpp>
