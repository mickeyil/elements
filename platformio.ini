[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_src_filter =
    +<colors.cpp>
    +<compositor.cpp>
    +<decoder.cpp>
    +<engine.cpp>
    +<esp_device.cpp>
    +<main.cpp>
    +<playback_device.cpp>
